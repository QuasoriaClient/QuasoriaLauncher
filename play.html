<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quasoria · Launching…</title>
    <meta name="theme-color" content="#05040f" />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="player">
    <canvas id="cosmos" aria-hidden="true"></canvas>

    <header class="pbar" id="pbar">
      <a class="pbtn" href="index.html#galaxy" title="Back to launcher" aria-label="Back to launcher">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg>
      </a>
      <a class="brand pbrand" href="index.html"><img src="assets/logo.svg" alt="" width="24" height="24" /></a>
      <div class="ptitle">
        <b id="pTitle">Loading…</b>
        <small class="mono muted" id="pSub"></small>
      </div>
      <div class="pactions">
        <label class="select select-sm" title="Runtime">
          <span class="sr-only">Runtime</span>
          <select id="pRuntime"></select>
        </label>
        <label class="select select-sm" title="Mirror">
          <span class="sr-only">Mirror</span>
          <select id="pMirror"></select>
        </label>
        <button class="pbtn" id="pReload" title="Reload" aria-label="Reload">
          <svg viewBox="0 0 24 24" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
        <button class="pbtn" id="pFull" title="Fullscreen (F11)" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <a class="pbtn" id="pPop" title="Open in new tab" aria-label="Open in new tab" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </a>
      </div>
    </header>

    <main class="stage" id="stage">
      <iframe
        id="game"
        title="Game"
        allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; cross-origin-isolated; screen-wake-lock"
        allowfullscreen
      ></iframe>

      <div class="loader" id="loader">
        <div class="loader-quasar" aria-hidden="true">
          <span class="lq-jet"></span>
          <span class="lq-disk"></span>
          <span class="lq-core"></span>
        </div>
        <h1 id="lTitle">Locking on…</h1>
        <p class="muted" id="lMsg">Aligning the telescope</p>
        <div class="progress" id="lProg" hidden><span id="lBar"></span></div>
        <p class="mono small muted" id="lStats"></p>
        <div class="loader-actions" id="lActions" hidden>
          <button class="btn btn-primary" id="lNext">Try next mirror</button>
          <a class="btn btn-ghost" href="index.html#galaxy">Back to launcher</a>
        </div>
      </div>
    </main>

    <script>window.QUASORIA_COSMOS = { quasar: false };</script>
    <script src="data/catalog.js"></script>
    <script src="js/noise.js"></script>
    <script src="js/cosmos.js"></script>
    <script src="js/store.js"></script>
    <script src="js/play.js"></script>
  </body>
</html>
